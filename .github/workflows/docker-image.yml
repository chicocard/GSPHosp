name: Imagem Docker + instalador

# Tag "v1.2.3" → constrói a imagem, testa que o noVNC responde, publica em
# ghcr.io/chicocard/gsphosp:1.2.3 (e :latest) e anexa GSPHosp-Docker-Setup-1.2.3.exe à Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.0.0)"
        required: true
        default: "0.0.0"

permissions:
  contents: write
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/gsphosp

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ github.event.inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "Versao: $v"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (carrega localmente para o teste)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGEM }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (noVNC responde e o app sobe)
        run: |
          docker run -d --name smoke -p 127.0.0.1:5800:5800 --shm-size 1g "$IMAGEM:${{ steps.ver.outputs.version }}"
          ok=0
          for i in $(seq 1 45); do sleep 2; if curl -fsS http://127.0.0.1:5800/ >/dev/null; then ok=1; break; fi; done
          docker exec smoke sh -c 'tail -n 20 /data/logs/supervisord.log; tail -n 10 /data/logs/gsphosp.log' || true
          docker rm -f smoke
          [ "$ok" = "1" ] || { echo "noVNC nao respondeu"; exit 1; }

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha

  instalador:
    needs: imagem
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar instalador Docker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.imagem.outputs.version }}" docker\instalador-docker.iss
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GSPHosp-Docker-Setup-${{ needs.imagem.outputs.version }}
          path: dist/GSPHosp-Docker-Setup-*.exe
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GSPHosp-Docker-Setup-*.exe
          generate_release_notes: true
