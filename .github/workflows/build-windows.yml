name: Instalador Windows

# Dispara ao publicar uma tag "v1.2.3" (ou manualmente, em Actions → Run workflow).
# Resultado: dist/GSPHosp-Setup-<versão>.exe anexado à Release da tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.0.0) para execução manual"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.event.inputs.version }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versao: $v"

      - name: Dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install -e . pyinstaller
          python -c "import PySide6, polars, duckdb; print('PySide6', PySide6.__version__, 'polars', polars.__version__, 'duckdb', duckdb.__version__)"

      - name: Testes
        shell: pwsh
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        run: |
          # build.ps1 cria .venv-build; no runner usamos o Python do setup-python direto
          $v = "${{ steps.ver.outputs.version }}"
          $partes = ($v -split '[^0-9]' | Where-Object { $_ -ne '' } | Select-Object -First 4); while ($partes.Count -lt 4) { $partes += '0' }
          $tupla = ($partes -join ', ')
          @"
          VSVersionInfo(ffi=FixedFileInfo(filevers=($tupla), prodvers=($tupla), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('041604B0', [StringStruct('CompanyName', 'NESCON/UFMG - Orbitaai'), StringStruct('FileDescription', 'GSPHosp'), StringStruct('FileVersion', '$v'), StringStruct('ProductName', 'GSPHosp'), StringStruct('ProductVersion', '$v'), StringStruct('OriginalFilename', 'GSPHosp.exe')])]), VarFileInfo([VarStruct('Translation', [1046, 1200])])])
          "@ | Set-Content build\versao.txt -Encoding UTF8
          python -m PyInstaller build\GSPHosp.spec --noconfirm --clean
          if (-not (Test-Path dist\GSPHosp\GSPHosp.exe)) { throw "PyInstaller nao gerou o executavel" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" build\instalador.iss
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Pacote portátil (ZIP)
        shell: pwsh
        run: Compress-Archive -Path dist\GSPHosp\* -DestinationPath "dist\GSPHosp-portatil-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GSPHosp-${{ steps.ver.outputs.version }}
          path: |
            dist/GSPHosp-Setup-*.exe
            dist/GSPHosp-portatil-*.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GSPHosp-Setup-*.exe
            dist/GSPHosp-portatil-*.zip
          generate_release_notes: true
