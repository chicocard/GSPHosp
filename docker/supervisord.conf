; Pilha gráfica do GSPHosp em contêiner. Ordem: Xvfb → openbox → x11vnc → noVNC → app.
[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
loglevel=info
user=root

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_GSPHOSP_RES)sx24 -nolisten tcp -ac +extension RANDR
priority=10
autorestart=true
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb.log

[program:openbox]
command=/opt/gsphosp/entrypoint.sh wait-x /usr/bin/openbox --config-file /opt/gsphosp/openbox-rc.xml
priority=20
autorestart=true
user=gsphosp
environment=DISPLAY=":0",HOME="/data"
stdout_logfile=/data/logs/openbox.log
stderr_logfile=/data/logs/openbox.log

[program:x11vnc]
command=/opt/gsphosp/entrypoint.sh wait-x /usr/bin/x11vnc -display :0 -forever -shared -rfbport 5900 -localhost -nopw -noxdamage -xkb -quiet
priority=30
autorestart=true
stdout_logfile=/data/logs/x11vnc.log
stderr_logfile=/data/logs/x11vnc.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 5800 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/data/logs/novnc.log
stderr_logfile=/data/logs/novnc.log

[program:gsphosp]
command=/opt/gsphosp/entrypoint.sh wait-x /usr/local/bin/python -m papahr
directory=/opt/gsphosp/app
priority=50
autorestart=true
startsecs=5
startretries=20
user=gsphosp
environment=DISPLAY=":0",HOME="/data",GSPHOSP_HOME="/data",GSPHOSP_OUTPUT="/data/output"
stdout_logfile=/data/logs/gsphosp.log
stderr_logfile=/data/logs/gsphosp.log
